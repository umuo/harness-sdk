site_name: Agent SDK
theme:
  name: material
  language: zh
  features:
    - navigation.tabs
    - navigation.sections
    - toc.integrate
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: 切换到暗色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: 切换到亮色模式

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

plugins:
  - search
  - mermaid2

nav:
  - 首页: index.md
  - 核心指南:
    - 架构设计: architecture.md
    - API 指南: api-guide.md
    - 示例代码: examples.md
    - MVP 范围: mvp.md
  - 核心能力:
    - 模型提供商: model-providers.md
    - OpenAI 适配: openai-provider.md
    - 多 Agent 协作: multi-agent.md
  - 工具与扩展:
    - 工具开发: tools.md
    - 内置工具: builtin-tools.md
    - 工具执行结果: tool-results.md
    - Agent 技能: skills.md
    - MCP 集成: mcp.md
    - 插件系统: plugins.md
  - 可观测性:
    - 核心概念: observability.md
    - Web 平台: observability-platform.md
